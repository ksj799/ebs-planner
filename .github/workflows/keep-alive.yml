# Render 무료 플랜은 15분간 요청이 없으면 잠든다 → 10분마다 접속해서 깨워 둔다
# (GitHub 예약 실행은 몇 분씩 늦어질 수 있어 100% 보장은 아님)
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping demo site
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' https://ebs-planner.onrender.com/api/info) || true
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
