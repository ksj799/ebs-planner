# 사내 공유 모드: 같은 회사망의 다른 PC 에서 https://<이 PC 주소>:8443 으로 접속. 로그인 필요, HTTPS 전용.
#   run-crp.ps1 -Share 로 실행하면 이 PC 전용 인증서(planner.p12)를 처음 한 번 자동으로 만든다.
server:
  address: 0.0.0.0
  port: ${PORT:8443}
  ssl:
    enabled: true
    key-store: ${user.home}/.ebs-planner/planner.p12
    key-store-type: PKCS12
    key-store-password: ${PLANNER_KS_PASSWORD}
    key-alias: planner
    enabled-protocols: TLSv1.2,TLSv1.3
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
  server-header: ""

planner:
  auth:
    enabled: true
  # 사용자 파일 (.\add-user.ps1 <ID> 로 등록)
  users-file: ${user.home}/.ebs-planner/users.txt

logging:
  file:
    # 로그인·접근 기록 (planner.audit)
    name: ${user.home}/.ebs-planner/logs/planner.log
