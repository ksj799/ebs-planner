<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · EBS 생산계획</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f6fa;--panel:#fff;--text:#0f172a;--text2:#475569;--line:#e2e8f0;--accent:#4f46e5;--accent2:#eef2ff;--bad:#dc2626;--bad2:#fef2f2}
@media (prefers-color-scheme: dark){:root{--bg:#0b1120;--panel:#111827;--text:#e5e7eb;--text2:#9ca3af;--line:#1f2937;--accent:#818cf8;--accent2:#1e1b4b;--bad:#f87171;--bad2:#2c0f12}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 Pretendard,"Malgun Gothic",system-ui,sans-serif;padding:16px}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:6px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center}
p{color:var(--text2);font-size:13px;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--text2);margin:0 0 6px}
input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel);color:var(--text);font:inherit;margin-bottom:14px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
button{width:100%;height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6}
.err{display:none;background:var(--bad2);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3 21V9l6 4V9l6 4V5h6v16z"/></svg></div>EBS 생산계획</div>
  <p>사내 사용자 로그인</p>
  <div class="err" id="err"></div>
  <label for="u">아이디</label>
  <input id="u" autocomplete="username" required autofocus>
  <label for="p">비밀번호</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b">로그인</button>
</form>
<script>
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const b=document.getElementById('b'),err=document.getElementById('err');
  b.disabled=true;err.style.display='none';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'planner'},
      body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
    if(r.ok){location.href='/';return}
    const j=await r.json().catch(()=>({}));
    err.textContent=j.message||'로그인하지 못했습니다.';err.style.display='block';
  }catch(x){err.textContent='서버에 연결할 수 없습니다.';err.style.display='block'}
  b.disabled=false;
};
</script>
</body>
</html>
